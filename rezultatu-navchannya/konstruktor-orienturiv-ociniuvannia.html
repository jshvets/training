<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Конструктор орієнтирів оцінювання з теми</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Layout: шапка зі зведенням → три колонки: кроки алгоритму · робоча область кроку · підказки до кроку */
:root{
  --bg:#eef1f6; --surface:#ffffff; --surface-2:#f6f8fb; --ink:#18202e; --muted:#5a6577; --line:#d6dce6;
  --accent:#1d4b9b; --accent-ink:#ffffff; --accent-soft:#e3ebf8;
  --hint:#8a5a0b; --hint-soft:#fbf0dc;
  --ok:#25744a; --ok-soft:#e1f2e8; --warn:#a63f27; --warn-soft:#fae6e0;
  --font-display:"Unbounded","IBM Plex Sans",system-ui,sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f141d; --surface:#171e2a; --surface-2:#1d2533; --ink:#e7ecf4; --muted:#9aa6b8; --line:#2c3647;
  --accent:#7ea6ec; --accent-ink:#0f141d; --accent-soft:#1f2d47;
  --hint:#e6b866; --hint-soft:#2e2615; --ok:#6fcf98; --ok-soft:#16301f; --warn:#f08f78; --warn-soft:#3a1d16; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f141d; --surface:#171e2a; --surface-2:#1d2533; --ink:#e7ecf4; --muted:#9aa6b8; --line:#2c3647;
  --accent:#7ea6ec; --accent-ink:#0f141d; --accent-soft:#1f2d47;
  --hint:#e6b866; --hint-soft:#2e2615; --ok:#6fcf98; --ok-soft:#16301f; --warn:#f08f78; --warn-soft:#3a1d16; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--font-body)}
h1,h2,h3{text-wrap:balance;margin:0}
h1{font:600 19px/1.25 var(--font-display);letter-spacing:-.01em}
h2{font:600 17px/1.3 var(--font-display);letter-spacing:-.01em}
h3{font-size:15px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
code,.code{font-family:var(--font-mono);font-size:12.5px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.brand{display:flex;flex-direction:column;gap:2px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:500;font-size:14px;line-height:1.3}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--warn)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.summary{display:flex;flex-wrap:wrap;gap:8px;padding:10px 20px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:13px;white-space:nowrap}
.chip b{font-variant-numeric:tabular-nums}
.chip.warn{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.chip.ok{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}

.banner{margin:12px 20px 0;padding:10px 14px;border-radius:var(--r);background:var(--accent-soft);display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}

.app{display:grid;grid-template-columns:250px minmax(0,1fr) 300px;gap:16px;padding:16px 20px 40px;align-items:start}
nav.steps{position:sticky;top:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px}
.stage{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:10px 8px 4px;font-weight:600}
.stepbtn{display:grid;grid-template-columns:26px 1fr;gap:8px;align-items:center;width:100%;text-align:left;border:0;background:transparent;border-radius:8px;padding:6px 8px;cursor:pointer;font-size:14px}
.stepbtn:hover{background:var(--surface-2)}
.stepbtn .num{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;border:1.5px solid var(--line);font-variant-numeric:tabular-nums}
.stepbtn.done .num{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.stepbtn.active{background:var(--accent-soft)}
.stepbtn.active .num{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

main.work{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;min-width:0}
.stephead{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.eyebrow{font-size:12px;color:var(--accent);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.lead{max-width:68ch;color:var(--muted)}
.stepnav{display:flex;justify-content:space-between;gap:10px;margin-top:22px;padding-top:14px;border-top:1px solid var(--line)}

aside.hints{position:sticky;top:12px;display:flex;flex-direction:column;gap:12px}
.hintcard{background:var(--hint-soft);border:1px solid color-mix(in srgb,var(--hint) 30%,transparent);border-radius:var(--r);padding:12px 14px}
.hintcard h3{color:var(--hint);font-size:13px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.hintcard ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:14px}
.hintcard.ex{background:var(--surface);border-color:var(--line)}
.hintcard.ex h3{color:var(--accent)}
.hintcard.err{background:var(--surface);border-color:var(--line)}
.hintcard.err h3{color:var(--warn)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 16px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.full{grid-column:1/-1}
label.lbl{font-size:13px;font-weight:600}
.help{font-size:12.5px;color:var(--muted)}
input[type=text],input[type=number],input[type=search],select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:7px 10px;font-size:14.5px}
textarea{resize:vertical;min-height:62px;line-height:1.45}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 12px;cursor:pointer;font-size:14px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}

.card{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--surface);display:flex;flex-direction:column;gap:10px}
.card.sel{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.card.support{border-color:var(--hint);box-shadow:inset 3px 0 0 var(--hint)}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.pill{display:inline-block;font-family:var(--font-mono);font-size:12px;padding:1px 7px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.pill.adv{border-color:var(--accent);color:var(--accent)}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap}
.tag.lead{background:var(--accent-soft);color:var(--accent)}
.tag.support{background:var(--hint-soft);color:var(--hint)}
.tag.match{background:var(--ok-soft);color:var(--ok)}
.b1{background:#eceff3;color:#4a5363}.b2{background:#e4eefc;color:#22508f}.b3{background:#e2f3ea;color:#22693f}.b4{background:#fdf0d9;color:#86560b}.b5{background:#fbe5de;color:#9a3a22}.b6{background:#eee5fb;color:#5b3596}
:root[data-theme="dark"] .b1,:root[data-theme="dark"] .b2,:root[data-theme="dark"] .b3,:root[data-theme="dark"] .b4,:root[data-theme="dark"] .b5,:root[data-theme="dark"] .b6{filter:brightness(.55) saturate(1.3);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .b1,:root:not([data-theme="light"]) .b2,:root:not([data-theme="light"]) .b3,:root:not([data-theme="light"]) .b4,:root:not([data-theme="light"]) .b5,:root:not([data-theme="light"]) .b6{filter:brightness(.55) saturate(1.3);color:#fff}}

details.grp{border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
details.grp>summary{cursor:pointer;padding:10px 14px;font-weight:600;list-style:none;display:flex;gap:10px;justify-content:space-between;align-items:center}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary::after{content:"▾";color:var(--muted)}
details.grp[open]>summary::after{content:"▴"}
.grpbody{padding:0 14px 14px;display:flex;flex-direction:column;gap:8px}
.cr{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:8px 10px;border-radius:8px;border:1px solid transparent}
.cr:hover{background:var(--surface-2)}
.cr.on{border-color:var(--accent);background:var(--accent-soft)}
.cr.on.sup{border-color:var(--hint);background:var(--hint-soft)}
.cr input[type=checkbox]{margin-top:4px;width:17px;height:17px;accent-color:var(--accent)}
.or{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:6px 8px;border-radius:8px}
.or.on{background:var(--accent-soft)}
.or input{margin-top:4px;width:16px;height:16px;accent-color:var(--accent)}

.cmp{display:grid;grid-template-columns:150px 1fr 1fr;gap:8px 12px;align-items:start}
.cmp .h{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.cmp .k{font-weight:600;font-size:13.5px;padding-top:7px}
.cmp .std{background:var(--surface-2);border-radius:8px;padding:7px 10px;font-size:14px;min-height:36px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipbtn{border:1px dashed var(--line);background:var(--surface);border-radius:999px;padding:2px 10px;font-size:13px;cursor:pointer}
.chipbtn:hover{border-color:var(--accent);color:var(--accent)}
.chipbtn.on{border-style:solid;border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}

.preview{border:1px solid var(--accent);background:var(--accent-soft);border-radius:var(--r);padding:12px 14px}
.preview .t{font-size:16px;font-weight:500}
.lint{display:flex;flex-direction:column;gap:4px;font-size:13px}
.lint .w{color:var(--warn)}
.lint .g{color:var(--ok)}
.res{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:start;border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.res .no{font:600 15px var(--font-display);color:var(--accent);padding-top:1px}
.res .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.res .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

.dist{display:flex;height:28px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.dist div{display:grid;place-items:center;font-size:12px;font-weight:600;min-width:0;overflow:hidden;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--surface-2);font-size:12.5px;font-weight:600}
td.c{text-align:center;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.mx td:first-child{min-width:320px}
.mx td.hit{background:var(--accent-soft);color:var(--accent);font-weight:700;text-align:center}
.mx td.miss{text-align:center;color:var(--line)}
.status{font-size:12.5px;font-weight:600;white-space:nowrap}
.status.ok{color:var(--ok)}.status.bad{color:var(--warn)}
.checks{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.checks li{display:grid;grid-template-columns:22px 1fr;gap:6px;font-size:14px}
.checks .i{font-weight:700}
.checks .ok .i{color:var(--ok)}.checks .bad .i{color:var(--warn)}

.rub{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rub .field label{font-size:12.5px}
.plan{border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;background:var(--surface);display:flex;flex-direction:column;gap:14px}
.plan h2{font-size:18px}
.plan h3{margin-top:6px}
.plan table{font-size:13.5px}
.empty{padding:18px;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted);text-align:center}

.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

@media (max-width:1180px){
  .app{grid-template-columns:230px minmax(0,1fr)}
  aside.hints{grid-column:2;position:static}
}
@media (max-width:780px){
  .app{grid-template-columns:1fr;padding:12px}
  nav.steps{position:static;display:flex;overflow-x:auto;gap:4px;padding:6px}
  .stage{display:none}
  .stepbtn{grid-template-columns:24px auto;white-space:nowrap;width:auto}
  aside.hints{grid-column:1}
  .grid2,.grid3{grid-template-columns:1fr}
  .cmp{grid-template-columns:1fr}
  .cmp .h{display:none}
  .rub{grid-template-columns:1fr 1fr}
  main.work{padding:16px}
  header.top,.summary{padding-left:12px;padding-right:12px}
  .banner{margin:12px 12px 0}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <h1>Конструктор орієнтирів оцінювання з теми</h1>
    <p class="muted small">Від вимог Державного стандарту (Додаток 14, інформатична галузь) до результатів навчання з теми · 10 кроків</p>
  </div>
  <div class="toolbar">
    <button class="btn" id="btnExample" type="button">Відкрити приклад «Бази даних»</button>
    <button class="btn" id="btnNew" type="button">Новий план</button>
    <button class="btn primary" id="btnToPlan" type="button">Готовий план</button>
  </div>
</header>
<div class="summary" id="summary"></div>
<div id="bannerSlot"></div>
<div class="app">
  <nav class="steps" id="steps" aria-label="Кроки алгоритму"></nav>
  <main class="work" id="work"></main>
  <aside class="hints" id="hints" aria-label="Підказки"></aside>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const STD = {"groups":[{"n":"1","t":"Пошук, подання, перетворення, аналіз, узагальнення та систематизація даних, критичне оцінювання інформації для розв’язання життєвих проблем"},{"n":"2","t":"Створення інформаційних продуктів і програм для ефективного розв’язання задач/проблем, творчого самовираження індивідуально і у співпраці з іншими особами за допомогою цифрових пристроїв чи без них"},{"n":"3","t":"Організація та усвідомлене використання цифрових середовищ для доступу до інформації, спілкування та співпраці як творця та/або споживача"},{"n":"4","t":"Усвідомлення результатів використання інформаційних технологій для себе, суспільства, навколишнього середовища і сталого розвитку суспільства, дотримання етичних і правових норм інформаційної взаємодії"}],"items":[{"c":"ІФО 1.1","k":"general","t":"Досліджує і оцінює вплив інформаційних технологій на своє життя, навколишній світ і розвиток","n":"1.1"},{"c":"12 ІФО 1.1.1","k":"concrete","t":"обґрунтовано обирає та доцільно використовує цифрові пристрої та/або інформаційні технології для розвʼязування задач з різних галузей, забезпечення життєвих потреб, спілкування, власного розвитку та навчання","n":"1.1.1"},{"c":"12 ІФО 1.1.1-1","k":"basic","t":"обґрунтовано обирає та доцільно використовує цифрові пристрої та/або інформаційні технології для розвʼязування задач з обраної галузі, зокрема під час здійснення професійної діяльності, забезпечення життєвих потреб, спілкування, власного розвитку та навчання","n":"1.1.1"},{"c":"12 ІФО 1.1.1-1 П","k":"adv","t":"оцінює можливості, функціонал, обмеження, переваги використання інформаційних технологій для вирішення проблем обраної галузі","n":"1.1.1"},{"c":"12 ІФО 1.1.1-2 П","k":"adv","t":"пояснює та наводить аргументи доцільності та ефективності використання цифрових пристроїв/інформаційних технологій в обраній галузі для вирішення життєвих, зокрема професійних, задач","n":"1.1.1"},{"c":"12 ІФО 1.1.1-3 П","k":"adv","t":"доцільно добирає цифрові пристрої та/або інформаційні техн const VERB_END = /(є|ує|ює|ить|ає|яє|іє|ться|еться|ується|юється)$/;
function verbLevel(word){
  const w = word.toLowerCase().replace(/[^а-яіїєґ’'-]/g,'');
  if (!VERB_END.test(w)) return 0;
  for (const [l, stems] of VERB_STEMS) if (stems.some(s => w.startsWith(s))) return l;
  return 0;
}
function textLevel(t){ return Math.max(0, ...t.split(/\s+/).map(verbLevel)); }

/* ---------- decomposition heuristic ---------- */
const ADV = /^(обґрунтовано|доцільно|аргументовано|самостійно|свідомо|критично|активно|гнучко|усвідомлено|ефективно|відповідально|безпечно)$/i;
const CONN = /^(та|і|й|або|чи|та\/або|а|також)$/i;
const CTX = [' для ',' під час ',' з використанням',' із застосуванням',' з урахуванням',' ураховуючи',' враховуючи',' використовуючи',' застосовуючи',' за допомогою',' в обраній',' у обраній',' з обраної',' в різних',' у різних',' з різних',' індивідуально',' у співпраці',' в команді',' спілкуючись'];
const QUAL = ['за наданими критеріями','за власними критеріями','на основі вироблених критеріїв','за наданими','індивідуально чи в проектній групі','самостійно або в співпраці','ефективн'];
function autoDecomp(t){
  const words = t.split(/\s+/);
  const act = [], qual = [];
  let i = 0;
  for (; i < words.length; i++){
    const w = words[i].replace(/[,;]$/,'');
    if (ADV.test(w)) { qual.push(w); act.push(w); continue; }
    if (CONN.test(w) && i+1 < words.length && (verbLevel(words[i+1]) || ADV.test(words[i+1]))) { act.push(w); continue; }
    if (verbLevel(w)) { act.push(w); continue; }
    break;
  }
  let rest = words.slice(i).join(' ');
  let idx = -1;
  CTX.forEach(m => { const k = (' ' + rest).indexOf(m); if (k > 0 && (idx < 0 || k < idx)) idx = k; });
  let obj = rest, ctx = '';
  if (idx > 0){ obj = (' ' + rest).slice(0, idx).trim(); ctx = (' ' + rest).slice(idx).trim(); }
  QUAL.forEach(q => { if (t.includes(q) && !qual.some(x => q.includes(x))) qual.push(q === 'ефективн' ? 'ефективність' : q); });
  return {action: act.join(' '), object: obj.replace(/[,;]\s*$/,''), context: ctx, quality: qual.join(', '), tAction:'', tObject:'', tContext:'', tQuality:''};
}

/* ---------- lint for result wording ---------- */
function lint(r){
  const out = []; const t = (r.text || '').trim(); const tl = t.toLowerCase();
  if (!t) return [{w:true, m:'Сформулюйте результат.'}];
  if (/^(знає|розуміє|усвідомлює|ознайомл|ознайомити|сформувати|навчити|розвивати|формувати|вміти|уміти)/.test(tl)) out.push({w:true, m:'Починається з неспостережуваного дієслова або мети вчителя. Почніть з дії учня: «пояснює», «будує», «оцінює».'});
  else if (/\b(знає|розуміє)\b/.test(tl)) out.push({w:true, m:'«Знає/розуміє» не можна побачити. Замініть дією, що це показує.'});
  const verbs = t.split(/\s+/).filter(w => verbLevel(w) >= 3).length;
  if (verbs > 3) out.push({w:true, m:`Схоже, тут ${verbs} дій. Перевірте, чи не варто розділити на окремі результати.`});
  if (/з обраної галузі|в обраній галузі|інформаційні моделі|інформаційні продукти|інформаційних продуктів|різних галузей/.test(tl)) out.push({w:true, m:'Є узагальнене формулювання зі стандарту. Назвіть конкретний об’єкт або галузь теми.'});
  if (t.length < 35) out.push({w:true, m:'Занадто коротко: додайте умови або критерій якості.'});
  if (!r.codes || !r.codes.length) out.push({w:true, m:'Не вказано код орієнтира стандарту.'});
  if (r.bloom && r.codes && r.codes.length){
    const need = Math.max(...r.codes.map(c => BY[c] ? textLevel(BY[c].t) : 0));
    if (need && r.bloom < need - 1) out.push({w:true, m:`Рівень результату (${BLOOM[r.bloom].n}) помітно нижчий за рівень дієслів орієнтира (${BLOOM[need].n}).`});
  }
  if (!out.length) out.push({w:false, m:'Формулювання спостережуване, конкретне й прив’язане до стандарту.'});
  return out;
}

/* ---------- helpers ---------- */
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pickedConcretes = () => CONCRETES.filter(c => state.picks[c.c]);
const pickedOrients = () => ITEMS.filter(i => (i.k === 'basic' || i.k === 'adv') && state.orients[i.c]);
const roleOfOrient = c => state.picks['12 ІФО ' + BY[c].n] || 'support';
function tokens(){
  const raw = (state.topic.concepts + ' ' + state.topic.title + ' ' + state.topic.tools).toLowerCase();
  const ws = raw.split(/[^а-яіїєґa-z’'-]+/).filter(w => w.length >= 5);
  return [...new Set(ws.map(w => w.slice(0, Math.max(5, Math.ceil(w.length * .7)))))];
}
function relevance(cr){
  const tk = tokens(); if (!tk.length) return [];
  const text = (cr.t + ' ' + ITEMS.filter(i => i.n === cr.n && i.k !== 'concrete').map(i => i.t).join(' ')).toLowerCase();
  return tk.filter(s => text.includes(s));
}
function toast(m){ const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 2200); }
function getPath(o, p){ return p.split('.').reduce((a, k) => a == null ? a : a[k], o); }
function setPath(o, p, v){ const ks = p.split('.'); let a = o; ks.slice(0,-1).forEach(k => { if (a[k] == null) a[k] = {}; a = a[k]; }); a[ks[ks.length-1]] = v; }

function done(n){
  const po = pickedOrients();
  switch(n){
    case 1: return !!(state.topic.title && state.topic.hours);
    case 2: return Object.values(state.picks).includes('lead');
    case 3: return po.length > 0 && pickedConcretes().every(c => po.some(o => o.n === c.n));
    case 4: return po.length > 0 && po.every(o => state.decomp[o.c] && state.decomp[o.c].action && state.decomp[o.c].object);
    case 5: return po.length > 0 && po.every(o => state.decomp[o.c] && state.decomp[o.c].tObject);
    case 6: return state.results.length > 0;
    case 7: return state.results.length > 0 && state.results.every(r => r.bloom);
    case 8: return state.results.length > 0 && coverage().uncoveredLead.length === 0 && state.results.every(r => r.codes.length);
    case 9: return state.results.length > 0 && state.results.every(r => r.indicators.filter(Boolean).length && r.task);
    case 10: return false;
  }
}
function coverage(){
  const po = pickedOrients();
  const map = po.map(o => ({o, rs: state.results.map((r, i) => r.codes.includes(o.c) ? i : -1).filter(i => i >= 0)}));
  return {map, uncoveredLead: map.filter(m => !m.rs.length && roleOfOrient(m.o.c) === 'lead'), uncovered: map.filter(m => !m.rs.length)};
}

function renderSummary(){
  const po = pickedOrients(), pc = pickedConcretes(), cov = coverage();
  const lead = pc.filter(c => state.picks[c.c] === 'lead').length;
  const h = +state.topic.hours || 0, rn = state.results.length;
  const tooMany = h && rn > h;
  document.getElementById('summary').innerHTML = [
    `<span class="chip">Тема: <b>${esc(state.topic.title || 'не вказано')}</b></span>`,
    `<span class="chip">Рівень: <b>${state.topic.level === 'adv' ? 'поглиблений (П)' : 'основний'}</b></span>`,
    `<span class="chip">Годин: <b>${esc(state.topic.hours || '—')}</b></span>`,
    `<span class="chip">Конкретних результатів: <b>${pc.length}</b> (провідних ${lead})</span>`,
    `<span class="chip">Орієнтирів: <b>${po.length}</b></span>`,
    `<span class="chip ${tooMany ? 'warn' : ''}">Результатів з теми: <b>${rn}</b>${tooMany ? ' — забагато для годин' : ''}</span>`,
    po.length ? (cov.uncovered.length ? `<span class="chip warn">Не покрито орієнтирів: <b>${cov.uncovered.length}</b></span>` : (rn ? `<span class="chip ok">Усі орієнтири покрито</span>` : '')) : ''
  ].join('');
  document.getElementById('bannerSlot').innerHTML = state.exampleBanner ?
    `<div class="banner"><span>Відкрито приклад «Бази даних. Реляційна модель даних». Перегляньте всі кроки, а щоб почати свою тему, натисніть «Новий план».</span><button class="btn sm" data-act="hideBanner" type="button">Зрозуміло</button></div>` : '';
}
function renderSteps(){
  let html = '', st = '';
  STEPS.forEach(s => {
    if (s.st !== st){ st = s.st; html += `<div class="stage">${STAGE[st]}</div>`; }
    html += `<button type="button" class="stepbtn ${state.step === s.n ? 'active' : ''} ${done(s.n) ? 'done' : ''}" data-go="${s.n}"><span class="num">${done(s.n) && state.step !== s.n ? '✓' : s.n}</span><span>${s.t}</span></button>`;
  });
  document.getElementById('steps').innerHTML = html;
}
function renderHints(){
  const h = HINTS[state.step];
  document.getElementById('hints').innerHTML = `
    <div class="hintcard"><h3>Підказка</h3><ul>${h.tip.map(x => `<li>${x}</li>`).join('')}</ul></div>
    <div class="hintcard ex"><h3>Приклад: «Бази даних»</h3><p style="font-size:14px">${h.ex}</p></div>
    <div class="hintcard err"><h3>Типові помилки</h3><ul>${h.err.map(x => `<li>${x}</li>`).join('')}</ul></div>`;
}
function head(n, lead){
  const s = STEPS[n-1];
  return `<div class="stephead"><span class="eyebrow">${STAGE[s.st]} · Крок ${n} з 10</span><h2>${s.t}</h2><p class="lead">${lead}</p></div>`;
}
function nav(n){
  return `<div class="stepnav">${n > 1 ? `<button class="btn" type="button" data-go="${n-1}">← ${STEPS[n-2].t}</button>` : '<span></span>'}${n < 10 ? `<button class="btn primary" type="button" data-go="${n+1}">${STEPS[n].t} →</button>` : ''}</div>`;
}
function inp(path, label, help, type){
  const v = getPath(state, path) ?? '';
  const ctl = type === 'area' ? `<textarea id="f-${path}" data-bind="${path}">${esc(v)}</textarea>` : `<input id="f-${path}" type="${type || 'text'}" data-bind="${path}" value="${esc(v)}">`;
  return `<div class="field"><label class="lbl" for="f-${path}">${label}</label>${ctl}${help ? `<span class="help">${help}</span>` : ''}</div>`;
}

function draft(){ if (!state.draft) state.draft = {id:null, bloom:3, action:'', object:'', cond:'', crit:'', text:'', manual:false, basic:'', codes:[]}; return state.draft; }
function composeDraft(d){ return [d.action, d.object, d.cond, d.crit].map(s => (s || '').trim()).filter(Boolean).join(' '); }

    <div class="field"><label class="lbl" for="db">Варіант для основного рівня / сходинка підтримки (необов’язково)</label><input type="text" id="db" data-bind="draft.basic" value="${esc(d.basic)}"></div>
    <div class="row"><button class="btn primary" type="button" data-act="saveDraft">${d.id ? 'Зберегти зміни' : 'Додати результат'}</button><button class="btn" type="button" data-act="clearDraft">Очистити</button></div>
  </div>`;
  html += `<h3 style="margin:20px 0 10px">Результати з теми (${state.results.length})</h3><div class="stack">`;
  html += state.results.length ? state.results.map((r, i) => {

  return html + `</div>` + nav(6);
};

VIEWS[8] = () => {
  const cov = coverage(), rs = state.results;
  let html = head(8, 'Перевірте, що кожен обраний орієнтир покрито, кожен результат має код, а рівень дій не знижено.');
  if (!cov.map.length) return html + `<div class="empty">Немає обраних орієнтирів (крок 3).</div>` + nav(8);
  html += `<div class="tablewrap"><table class="mx"><thead><tr><th>Орієнтир</th><th>Роль</th>${rs.map((r, i) => `<th class="c" title="${esc(r.text)}">${i+1}</th>`).join('')}<th>Статус</th></tr></thead><tbody>`;
  cov.map.forEach(m => {
    const need = textLevel(m.o.t), max = Math.max(0, ...m.rs.map(i => rs[i].bloom));
    const lvlBad = m.rs.length && need && max < need - 1;
    const role = roleOfOrient(m.o.c);
    html += `<tr><td><span class="pill ${m.o.k === 'adv' ? 'adv' : ''}">${m.o.c}</span><div class="small muted" style="margin-top:3px;max-width:60ch">${esc(m.o.t)}</div></td><td><span class="tag ${role}">${role === 'lead' ? 'провідний' : 'супутній'}</span></td>
      ${rs.map((r, i) => m.rs.includes(i) ? `<td class="hit">✓</td>` : `<td class="miss">·</td>`).join('')}
      <td>${!m.rs.length ? `<span class="status bad">не покрито</span>` : lvlBad ? `<span class="status bad">рівень знижено</span>` : `<span class="status ok">покрито</span>`}</td></tr>`;
  });
  html += `</tbody></table></div>`;
  const noCode = rs.filter(r => !r.codes.length).length;
  const h = +state.topic.hours || 0;
  const lead = cov.map.filter(m => roleOfOrient(m.o.c) === 'lead');
  const checks = [
    [cov.uncoveredLead.length === 0, cov.uncoveredLead.length ? `Не покрито провідних орієнтирів: ${cov.uncoveredLead.map(m => m.o.c).join(', ')}.` : `Усі провідні орієнтири (${lead.length}) покрито.`],
    [cov.uncovered.length - cov.uncoveredLead.length === 0, cov.uncovered.length - cov.uncoveredLead.length ? `Не покрито супутніх орієнтирів: ${cov.uncovered.filter(m => roleOfOrient(m.o.c) !== 'lead').map(m => m.o.c).join(', ')}. Додайте результат або зніміть орієнтир на кроці 3.` : 'Усі супутні орієнтири покрито.'],
    [noCode === 0, noCode ? `Результатів без коду стандарту: ${noCode}.` : 'Кожен результат має код орієнтира.'],
    [!h || (rs.length <= h && rs.length >= Math.ceil(h / 3)), h ? `Результатів ${rs.length} на ${h} год. Орієнтовно варто мати ${Math.ceil(h * .5)}–${Math.round(h * .9)}.` : 'Вкажіть кількість годин на кроці 1, щоб перевірити реалістичність.'],
    [cov.map.every(m => { const need = textLevel(m.o.t), max = Math.max(0, ...m.rs.map(i => rs[i].bloom)); return !m.rs.length || !need || max >= need - 1; }), 'Рівень дій: для кожного покритого орієнтира хоча б один результат близький до рівня його дієслів.']
  ];
  html += `<ul class="checks" style="margin-top:14px">${checks.map(([ok, m]) => `<li class="${ok ? 'ok' : 'bad'}"><span class="i">${ok ? '✓' : '!'}</span><span>${m}</span></li>`).join('')}</ul>`;
  return html + nav(8);
};

function planHTML(){
  const t = state.topic, rs = state.results, cov = coverage();
  const cell = s => esc(s || '');
  let h = `<h2>${cell(t.title || 'Тема')}</h2><p>${cell(t.subject)}, ${cell(t.grade)} клас, ${t.level === 'adv' ? 'поглиблений рівень' : 'основний рівень'}, ${cell(t.hours)} год.</p>`;
  h += `<table border="1" cellpadding="5" style="border-collapse:collapse"><tbody>
    <tr><th align="left">Ключові поняття</th><td>${cell(t.concepts)}</td></tr><tr><th align="left">Цифрові засоби</th><td>${cell(t.tools)}</td></tr>
    <tr><th align="left">Обрана галузь / профіль</th><td>${cell(t.field)}</td></tr><tr><th align="left">Опора / перспектива</th><td>${cell(t.prior)} → ${cell(t.next)}</td></tr></tbody></table>`;
  h += `<h3>Орієнтири Державного стандарту, що реалізуються в темі</h3><table border="1" cellpadding="5" style="border-collapse:collapse"><thead><tr><th>Код</th><th>Орієнтир</th><th>Роль</th><th>Результати з теми</th></tr></thead><tbody>${cov.map.map(m => `<tr><td>${m.o.c}</td><td>${cell(m.o.t)}</td><td>${roleOfOrient(m.o.c) === 'lead' ? 'провідний' : 'супутній'}</td><td>${m.rs.map(i => i+1).join(', ') || '—'}</td></tr>`).join('')}</tbody></table>`;
  h += `<h3>Результати навчання (орієнтири оцінювання) з теми</h3><table border="1" cellpadding="5" style="border-collapse:collapse"><thead><tr><th>№</th><th>Рівень</th><th>Результат</th><th>Варіант для основного рівня</th><th>Код</th></tr></thead><tbody>${rs.map((r, i) => `<tr><td>${i+1}</td><td>${BLOOM[r.bloom].n}</td><td>${cell(r.text)}</td><td>${cell(r.basic)}</td><td>${r.codes.join('; ')}</td></tr>`).join('')}</tbody></table>`;
  h += `<h3>Індикатори, завдання та оцінювання</h3><table border="1" cellpadding="5" style="border-collapse:collapse"><thead><tr><th>№</th><th>Доказ</th><th>Індикатори</th><th>Завдання</th><th>Вид</th></tr></thead><tbody>${rs.map((r, i) => `<tr><td>${i+1}</td><td>${cell(r.evidence)}</td><td>${r.indicators.filter(Boolean).map(cell).join('<br>')}</td><td>${cell(r.task)}</td><td>${r.assess === 'summative' ? 'підсумкове' : 'формувальне'}</td></tr>`).join('')}</tbody></table>`;
  const withRub = rs.map((r, i) => [r, i]).filter(([r]) => r.rubric.some(Boolean));
  if (withRub.length) h += `<h3>Опис рівнів досягнень</h3><table border="1" cellpadding="5" style="border-collapse:collapse"><thead><tr><th>№</th><th>Початковий</th><th>Середній</th><th>Достатній</th><th>Високий</th></tr></thead><tbody>${withRub.map(([r, i]) => `<tr><td>${i+1}</td>${r.rubric.map(x => `<td>${cell(x)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  h += `<h3>Критерії успіху для учнів</h3><ul>${rs.filter(r => r.can).map(r => `<li>☐ ${cell(r.can)}</li>`).join('')}</ul>`;
  h += `<p style="font-size:12px;color:#666">Джерело орієнтирів: Додаток 14 до Державного стандарту, інформатична освітня галузь.</p>`;
  return h;
}
function planText(){
  const t = state.topic, rs = state.results;
  let s = `${t.title}\n${t.subject}, ${t.grade} клас, ${t.level === 'adv' ? 'поглиблений' : 'основний'} рівень, ${t.hours} год.\n\nРЕЗУЛЬТАТИ З ТЕМИ\n`;
  rs.forEach((r, i) => { s += `${i+1}. ${r.text} [${r.codes.join('; ')}] (${BLOOM[r.bloom].n})\n`; if (r.indicators.length) s += `   Індикатори: ${r.indicators.filter(Boolean).join('; ')}\n`; if (r.task) s += `   Завдання: ${r.task}\n`; });
  s += `\nКРИТЕРІЇ УСПІХУ\n` + rs.filter(r => r.can).map(r => `☐ ${r.can}`).join('\n');
  return s;
}

function render(){
  renderSummary(); renderSteps(); renderHints();
  document.getElementById('work').innerHTML = VIEWS[state.step]();
  save();
}
function soft(){ renderSummary(); renderSteps(); save(); }

/* ---------- events ---------- */
let lastField = null;
document.addEventListener('focusin', e => { if (e.target.matches('#work input[type=text], #work textarea')) lastField = e.target; });
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'q'){ state.ui_q = el.value; const pos = el.selectionStart; render(); const q = document.getElementById('q'); q.focus(); q.setSelectionRange(pos, pos); return; }
  const p = el.dataset.bind; if (!p) return;
  let v = el.value;
  if (el.dataset.num) v = +v;
  if (el.dataset.lines) v = v.split('\n');
  setPath(state, p, v);
  if (p.startsWith('draft.')){
    const d = state.draft;
    if (el.dataset.manual) d.manual = true;
    if (el.dataset.live && !d.manual){ d.text = composeDraft(d); const t = document.getElementById('dtext'); if (t) t.value = d.text; }
    const lb = document.getElementById('lintBox'); if (lb) lb.innerHTML = lint(d).map(x => `<span class="${x.w ? 'w' : 'g'}">${x.w ? '⚠' : '✓'} ${x.m}</span>`).join('');
  }
  soft();
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'onlyMatch'){ state.ui_only = el.checked; render(); return; }
  if (el.dataset.bind === 'draft.bloom'){ render(); return; }
  if (el.dataset.act === 'bloomSel'){ state.results[+el.dataset.i].bloom = +el.value; render(); return; }
  if (el.dataset.act === 'pick'){ const c = el.dataset.c; if (el.checked) state.picks[c] = 'lead'; else { delete state.picks[c]; ITEMS.filter(i => i.n === BY[c].n && i.k !== 'concrete').forEach(o => delete state.orients[o.c]); } state.exampleBanner = false; render(); return; }
  if (el.dataset.act === 'orient'){ const c = el.dataset.c; if (el.checked){ state.orients[c] = true; if (!state.decomp[c]) state.decomp[c] = autoDecomp(BY[c].t); } else delete state.orients[c]; render(); return; }
  if (el.dataset.bind && el.tagName === 'SELECT'){ render(); return; }
  if (el.id === 'importFile' && el.files[0]){ const fr = new FileReader(); fr.onload = () => { document.getElementById('importBox').value = fr.result; }; fr.readAsText(el.files[0]); }
});
document.addEventListener('toggle', e => { const d = e.target; if (d.dataset && d.dataset.det !== undefined && d.open) state.ui_open9 = +d.dataset.det; }, true);

let newArmed = 0;
document.addEventListener('click', async e => {
  const g = e.target.closest('[data-go]');
  if (g){ state.step = +g.dataset.go; render(); window.scrollTo({top:0, behavior:'auto'}); return; }
  const b = e.target.closest('[data-act]'); if (!b || b.tagName === 'INPUT' || b.tagName === 'SELECT') return;
  const a = b.dataset.act, c = b.dataset.c, i = +b.dataset.i;
  const d = () => draft();
  switch(a){
    case 'hideBanner': state.exampleBanner = false; render(); break;
    case 'level': state.topic.level = b.dataset.v; render(); break;
    case 'role': state.picks[c] = b.dataset.v; render(); break;
    case 'alt': state.ui_alt = state.ui_alt || {}; state.ui_alt[c] = !state.ui_alt[c]; render(); break;
    case 'auto': { const old = state.decomp[c] || {}; state.decomp[c] = Object.assign(autoDecomp(BY[c].t), {tAction:old.tAction||'', tObject:old.tObject||'', tContext:old.tContext||'', tQuality:old.tQuality||''}); render(); toast('Чернетку розкладання створено. Перевірте її.'); break; }
    case 'autoAll': pickedOrients().forEach(o => { const cur = state.decomp[o.c] || {}; const a2 = autoDecomp(o.t); ['action','object','context','quality'].forEach(k => { if (!cur[k]) cur[k] = a2[k]; }); state.decomp[o.c] = Object.assign({tAction:'',tObject:'',tContext:'',tQuality:''}, cur); }); render(); toast('Порожні поля заповнено.'); break;
    case 'ins': if (lastField && document.body.contains(lastField)){ const f = lastField; const s = f.selectionStart ?? f.value.length; const v = b.dataset.v; const pre = f.value.slice(0, s), post = f.value.slice(f.selectionEnd ?? s); const sep = pre && !/[\s,(]$/.test(pre) ? ', ' : ''; f.value = pre + sep + v + post; f.dispatchEvent(new Event('input', {bubbles:true})); f.focus(); } else toast('Спершу клацніть поле «У темі стає».'); break;
    case 'toBuilder': { const x = state.decomp[c] || {}; state.draft = {id:null, bloom: Math.max(2, Math.min(6, textLevel(BY[c].t) || 3)), action: x.tAction || x.action || '', object: x.tObject || '', cond: x.tContext || '', crit: x.tQuality || '', text:'', manual:false, basic:'', codes:[c]}; state.step = 6; render(); window.scrollTo({top:0}); break; }
    case 'dcode': { const dd = d(); dd.codes = dd.codes.includes(c) ? dd.codes.filter(x => x !== c) : [...dd.codes, c]; render(); break; }
    case 'verb': { const dd = d(); dd.action = b.dataset.v; dd.manual = false; render(); break; }
    case 'unmanual': d().manual = false; render(); break;
    case 'saveDraft': { const dd = d(); const text = (dd.text || composeDraft(dd)).trim(); if (!text){ toast('Сформулюйте результат.'); break; }
      if (dd.id){ const r = state.results.find(x => x.id === dd.id); Object.assign(r, {bloom:+dd.bloom, text, basic:dd.basic, codes:[...dd.codes], parts:{action:dd.action, object:dd.object, cond:dd.cond, crit:dd.crit}}); toast('Зміни збережено.'); }
      else { state.results.push({id:uid(), bloom:+dd.bloom, text, basic:dd.basic, codes:[...dd.codes], parts:{action:dd.action, object:dd.object, cond:dd.cond, crit:dd.crit}, evidence:'', indicators:[], task:'', assess: dd.codes.some(x => roleOfOrient(x) === 'lead') ? 'summative' : 'formative', rubric:['','','',''], can:''}); toast('Результат додано.'); }
      state.draft = null; render(); break; }
    case 'clearDraft': state.draft = null; render(); break;
    case 'editRes': { const r = state.results[i]; const p = r.parts || {}; state.draft = {id:r.id, bloom:r.bloom, action:p.action||'', object:p.object||'', cond:p.cond||'', crit:p.crit||'', text:r.text, manual:true, basic:r.basic||'', codes:[...r.codes]}; render(); window.scrollTo({top:0}); break; }
    case 'delRes': if (b.dataset.armed){ state.results.splice(i, 1); render(); toast('Результат видалено.'); } else { b.dataset.armed = '1'; b.textContent = 'Точно видалити?'; setTimeout(() => { if (document.body.contains(b)){ delete b.dataset.armed; b.textContent = 'Видалити'; } }, 3000); } break;
    case 'up': if (i > 0){ [state.results[i-1], state.results[i]] = [state.results[i], state.results[i-1]]; render(); } break;
    case 'down': if (i < state.results.length - 1){ [state.results[i+1], state.results[i]] = [state.results[i], state.results[i+1]]; render(); } break;
    case 'sortBloom': state.results = state.results.map((r, k) => [r, k]).sort((x, y) => x[0].bloom - y[0].bloom || x[1] - y[1]).map(x => x[0]); render(); break;
    case 'rubric': { const r = state.results[i]; const ind = r.indicators.map(s => s.trim()).filter(Boolean); if (!ind.length){ toast('Спершу запишіть індикатори.'); break; }
      const n = ind.length, half = Math.max(1, Math.ceil(n / 2));
      r.rubric = [
        `з допомогою вчителя частково виконує: ${ind[0]}`,
        `самостійно виконує: ${ind.slice(0, half).join('; ')}`,
        `самостійно виконує: ${ind.slice(0, Math.max(half, n - 1)).join('; ')}${n > 1 ? '; допускає неточності в останньому' : ''}`,
        `виконує всі індикатори (${ind.join('; ')}), пояснює та обґрунтовує свої рішення`];
      render(); toast('Шаблон рівнів складено. Відредагуйте за потреби.'); break; }
    case 'can': { const r = state.results[i]; let t = r.text.replace(/^(\S+)/, w => w); const map = [['пояснює','пояснити'],['порівнює','порівняти'],['будує','побудувати'],['перетворює','перетворити'],['обґрунтовано добирає','обґрунтовано добрати'],['добирає','добрати'],['створює','створити'],['складає','скласти'],['досліджує','дослідити'],['виявляє','виявити'],['оцінює','оцінити'],['пропонує','запропонувати'],['аналізує','проаналізувати'],['використовує','використати'],['застосовує','застосувати'],['наводить','навести'],['описує','описати'],['розробляє','розробити'],['визначає','визначити'],['перевіряє','перевірити'],['нормалізує','нормалізувати'],['класифікує','класифікувати'],['розрізняє','розрізнити'],['налаштовує','налаштувати'],['формулює','сформулювати'],['візуалізує','візуалізувати'],['імпортує','імпортувати'],['обґрунтовує','обґрунтувати'],['моделює','змоделювати'],['проєктує','спроєктувати']];
      map.forEach(([f, to]) => { t = t.replace(new RegExp('(^|\\s)' + f + '(?=[\\s,]|$)', 'g'), '$1' + to); });
      r.can = 'Я можу ' + t.replace(/\s*\[.*?\]/g, '') + '.'; render(); break; }
    case 'copyHTML': await copy(planHTML(), planText()); break;
    case 'copyText': await copy(null, planText()); break;
    case 'copyJSON': { const s = JSON.parse(JSON.stringify(state)); delete s.draft; await copy(null, JSON.stringify(s)); break; }
    case 'import': { try { const s = JSON.parse(document.getElementById('importBox').value); if (!s.topic || !s.results) throw 0; state = Object.assign(blank(), s, {step:1, exampleBanner:false}); render(); toast('План імпортовано.'); } catch(err){ toast('Не вдалося прочитати JSON. Перевірте, що вставлено повну копію.'); } break; }
  }
});
async function copy(html, text){
  try {
    if (html && window.ClipboardItem){ await navigator.clipboard.write([new ClipboardItem({'text/html': new Blob([html], {type:'text/html'}), 'text/plain': new Blob([text], {type:'text/plain'})})]); toast('Скопійовано. Вставте в Word або Google Docs.'); return; }
    await navigator.clipboard.writeText(text); toast('Скопійовано в буфер обміну.');
  } catch(e){
    const f = document.getElementById('fallback');
    if (f){ f.innerHTML = `<div class="field" style="margin-top:14px"><label class="lbl" for="fb">Автоматичне копіювання заблоковано. Виділіть текст і скопіюйте вручну (Ctrl+C)</label><textarea id="fb" style="min-height:160px">${esc(text)}</textarea></div>`; const t = document.getElementById('fb'); t.focus(); t.select(); }
  }
}
document.getElementById('btnExample').onclick = () => { state = example(); render(); toast('Відкрито приклад «Бази даних».'); };
document.getElementById('btnToPlan').onclick = () => { state.step = 10; render(); };
document.getElementById('btnNew').onclick = e => {
  const b = e.currentTarget;
  if (newArmed){ clearTimeout(newArmed); newArmed = 0; b.textContent = 'Новий план'; state = blank(); render(); toast('Створено порожній план.'); return; }
  b.textContent = 'Натисніть ще раз: поточний план буде очищено';
  newArmed = setTimeout(() => { newArmed = 0; b.textContent = 'Новий план'; }, 3500);
};

state = load() || example();
render();
</script>
